services:

  caddy:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build: ./backend
    image: chatly-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: chatly-backend
    restart: unless-stopped
    command: celery -A core worker --loglevel=info
    env_file: .env
    depends_on:
      - api

  openwa:
    # WhatsApp pessoal dos atendentes. SQLite no próprio volume: não toca no Postgres do Django.
    image: ghcr.io/rmyndharis/openwa:0.23.7
    restart: unless-stopped
    mem_limit: 1g
    volumes:
      - openwa_data:/app/data
    environment:
      PORT: 2785
      ENGINE_TYPE: baileys
      # vem desligado: sem isso áudio do navegador não vira nota de voz (converte pra OGG/Opus)
      MEDIA_CONVERSION_ENABLED: "true"
      # semeia a chave admin no primeiro boot (mín. 32 caracteres); depois disso mudar aqui não rotaciona
      API_MASTER_KEY: ${OPENWA_API_KEY}
      # instância única: sessões pareadas voltam sozinhas depois de restart/deploy
      AUTO_START_SESSIONS: "true"
      # webhook só pode sair pra api (guard de SSRF do OpenWA)
      SSRF_ALLOWED_HOSTS: api

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  openwa_data:
