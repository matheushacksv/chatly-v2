services:

  caddy:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build: ./backend
    image: chatly-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: chatly-backend
    restart: unless-stopped
    command: celery -A core worker --loglevel=info
    env_file: .env
    depends_on:
      - api

  evolution-go:
    image: evoapicloud/evolution-go:latest
    restart: unless-stopped
    volumes:
      - evolution_data:/app/dbdata
      - evolution_logs:/app/logs
    environment:
      SERVER_PORT: 4000
      CLIENT_NAME: chatly
      GLOBAL_API_KEY: ${EVOLUTION_API_KEY}
      POSTGRES_AUTH_DB: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/evogo_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: "true"
      WADEBUG: INFO
      LOGTYPE: console
      LOG_DIRECTORY: /app/logs
      CONNECT_ON_STARTUP: "false"
      OS_NAME: Linux
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  evolution_data:
  evolution_logs:
