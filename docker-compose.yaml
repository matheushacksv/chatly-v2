services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  openwa:
    image: ghcr.io/rmyndharis/openwa:0.23.7
    restart: unless-stopped
    # dashboard + Swagger em http://localhost:2785; SQLite no volume, nada no Postgres
    ports:
      - "2785:2785"
    volumes:
      - openwa_data:/app/data
    environment:
      PORT: 2785
      ENGINE_TYPE: baileys
      ENABLE_SWAGGER: "true"
      # webhook só sai pra esses hosts (guard de SSRF do OpenWA)
      SSRF_ALLOWED_HOSTS: api,host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      OPENWA_API_URL: http://openwa:2785
    command: celery -A core worker --loglevel=info
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    # o .env usa localhost (pro runserver no host); dentro da rede os nomes dos serviços resolvem
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      OPENWA_API_URL: http://openwa:2785
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv  # preserva o venv da imagem (o mount de ./backend não pode escondê-lo)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      openwa:
        condition: service_started

volumes:
  postgres_data:
  openwa_data:
